name: Topic Monitor Daily Digest

on:
  schedule:
    # GitHub cron uses UTC. Minute 17 avoids the top-of-hour congestion that
    # can delay or drop scheduled events. The runner enforces local time and
    # catches up on the first available run after the configured send time.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: topic-monitor-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore daily send state
        uses: actions/cache/restore@v4
        with:
          path: last_sent_date
          key: topic-monitor-send-state-${{ github.run_id }}
          restore-keys: |
            topic-monitor-send-state-

      - name: Install dependencies
        run: python -m pip install --upgrade google-genai certifi

      - name: Run topic monitor
        id: topic-monitor
        env:
          TOPIC_MONITOR_CONFIG_DIR: ${{ github.workspace }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          SCHEDULE_TIME: ${{ vars.SCHEDULE_TIME || '08:00' }}
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE || 'America/Los_Angeles' }}
          SCHEDULED_WINDOW_HOURS: ${{ vars.SCHEDULED_WINDOW_HOURS || '24' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/run_daily.py --force
          else
            python scripts/run_daily.py --respect-schedule
          fi

      - name: Persist successful send state
        if: steps.topic-monitor.outputs.sent_today == 'true'
        uses: actions/cache/save@v4
        with:
          path: last_sent_date
          key: topic-monitor-send-state-${{ github.run_id }}
